# Netlify build settings.
#
# Only build_dist.py runs here. bake.py is deliberately NOT part of the build:
# it needs tools/raw/ (3+ MB of raw API dumps) which is gitignored. The baked
# data/islamdle.json is committed instead, so a Netlify build just assembles
# dist/ from what is already in the repo.
#
# Re-bake locally whenever puzzle content changes:
#   python tools/bake.py && git add data/islamdle.json && git commit

[build]
  command = "python3 tools/build_dist.py"
  publish = "dist"

# SUPABASE_ANON_KEY is Supabase's *publishable* key: public by design and
# written into js/account.js on purpose (row-level security protects the data).
# Netlify's secret scanner would otherwise fail every build on it. All other
# variables (BMC_WEBHOOK_SECRET, SUPPORTER_SECRET) are still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL"

# dist/_headers carries the cache and security headers; Netlify reads it
# automatically from the publish directory.

[[redirects]]
  from = "/play"
  to = "/play.html"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

# Supporter (ad-free) checks: bmc-webhook records Buy Me a Coffee donations,
# supporter hands out ad-free tokens. Both need BMC_WEBHOOK_SECRET and
# SUPPORTER_SECRET set in the Netlify environment variables.
[functions]
  directory = "netlify/functions"
