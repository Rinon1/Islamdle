<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islamdle — today's puzzle</title>
<meta name="description" content="Play today's Islamdle puzzle.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<!-- Must stay first: sets Consent Mode to denied before any tag can fire. -->
<script src="js/consent.js"></script>
<!-- Marks supporters ad-free before any ad slot renders. -->
<script src="js/support.js"></script>
</head>
<body>
<div class="wrap">

  <div class="playbar">
    <a class="back" href="index.html">← All puzzles</a>
    <div class="playbar-mid">
      <b id="p-title">…</b>
      <span id="p-meta"></span>
      <span class="p-timer" id="p-timer">0:00</span>
    </div>
    <div class="levelswitch" id="levelswitch" role="group" aria-label="Difficulty"></div>
  </div>

  <main class="panel">
    <p class="prompt" id="prompt">Loading…</p>
    <p class="sub" id="sub"></p>

    <div id="stage"></div>
    <div class="msg" id="msg" role="status"></div>
    <div id="result"></div>
  </main>

  <nav class="othergames" id="othergames" aria-label="Other puzzles today"></nav>

  <div class="ad-slot" data-slot="play-bottom"></div>

  <footer>
    <p>
      <a href="index.html">Home</a> ·
      <a href="privacy.html">Privacy policy</a> ·
      <a href="#" id="consent-reopen">Privacy settings</a>
      <span data-support hidden> · <a href="#">Support Islamdle</a></span>
    </p>
    <p class="powered">Powered by <b>Dua Companion</b></p>
  </footer>
</div>


<!-- End-of-puzzle results: per-puzzle and overall time and mistakes. -->
<div class="modal" id="modal-results" hidden>
  <div class="box">
    <h2>Today's set &middot; <span id="rs-num"></span></h2>
    <div id="results-body"></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/account.js"></script>
<script src="js/play.js"></script>
<script src="js/ads.js"></script>
</body>
</html>
